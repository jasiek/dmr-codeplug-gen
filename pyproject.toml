[project]
name = "dmr-codeplug-pl"
version = "0.1.0"
description = ""
authors = [{ name = "Jan Szumiec", email = "jan.szumiec@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "Unidecode>=1.3.6,<2",
    "maidenhead>=1.7.0,<2",
    "pyyaml>=6.0.1,<7",
    "requests>=2.33.0,<3",
    "lxml>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "black>=26.3.1,<27",
    "pylint>=3.0.3,<4",
    "pytest>=9.0.3,<10",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
